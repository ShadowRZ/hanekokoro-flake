[character]
success_symbol = "[@](bold peach)"
error_symbol = "[@](bold maroon)"
vimcmd_symbol = "[[COMMAND] @](dimmed peach)"

[time]
disabled = false
format = " [$time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "bold dimmed teal"

[directory]
home_symbol = "~"
truncate_to_repo = true
truncation_length = 0
truncation_symbol = "▢ "
read_only = " -W"
use_os_path_sep = true
style = "bold flamingo"
format = "[$path]($style)[$read_only]($read_only_style)"
repo_root_style = "bold flamingo"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)"

[cmd_duration]
format = "[◄ $duration ](bold subtext0)"

[jobs]
format = "[$symbol $number]($style) "
style = "bold subtext1"
symbol = "[▶](bold subtext1)"

# Use VCS Module instead of induvidal modules

[vcs]
disabled = false
order = ["git", "hg", "pijul", "fossil"]

## VCS: Git

[git_branch]
format = " [$symbol $branch(:$remote_branch)]($style)"
symbol = "[](bold peach)"
style = "bold teal"
always_show_remote = false
only_attached = true
truncation_symbol = ""
ignore_branches = ["master", "main"]

[git_commit]
format = " [$hash$tag*]($style)"
style = "bold yellow"
only_detached = true

[git_state]
style = "bold teal"
format = "(◌ [$state( $progress_current/$progress_total)]($style))"

[git_status]
format = "( [$all_status](bold maroon) [$ahead_behind]($style))"
style = "bold mauve"
ignore_submodules = true
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
renamed = "r"
deleted = "x"

[username]
format = "[▢ $user]($style) "

[hostname]
style = "bold mauve"
ssh_symbol = "*"
format = "[▢ $ssh_symbol$hostname]($style) "

# VCS: Fossil

[fossil_branch]
format = " [$symbol $branch(:$remote_branch)]($style)"
symbol = "[](bold peach)"
style = "bold teal"
truncation_symbol = ""

# VCS: Mercurial

[hg_branch]
format = " [$symbol $branch(:$remote_branch)]($style)"
symbol = "[](bold peach)"
style = "bold teal"
truncation_symbol = ""

# VCS: Pijul

[pijul_channel]
format = " [$symbol $branch(:$remote_branch)]($style)"
symbol = "[](bold peach)"
style = "bold teal"
truncation_symbol = ""

[nix_shell]
format = " [$symbol]($style)( [$name](bold blue)) [$state]($style)"
impure_msg = '[\(impure\)](bold red)'
pure_msg = '[\(pure\)](bold green)'
unknown_msg = '[\(??\)](bold yellow)'
symbol = "*"

